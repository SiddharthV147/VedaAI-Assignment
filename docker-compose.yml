services:
  backend:
    build:
      context: ./backend
    image: textt-pipeline
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      TEXT_USE_CUDA: auto
      TEXT_MODELS_DIR: /app/models
      UPLOAD_DIR: /app/user_data
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend/models:/app/models:z
      - ./backend/user_data:/app/user_data:z
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
