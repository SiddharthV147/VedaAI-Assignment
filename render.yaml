# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Backend is the repo-root Dockerfile (CPU PyTorch; models download at build).
# Frontend is a Node service — it does not use Docker.
# Use at least 8 GB RAM on the backend or TrOCR-large will OOM.

services:
  - type: web
    name: vedai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 4c-8g
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: TEXT_USE_CUDA
        value: cpu
      - key: TEXT_MODELS_DIR
        value: /app/models
      - key: UPLOAD_DIR
        value: /app/user_data
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.onrender\.com
      - key: ALLOWED_ORIGINS
        fromService:
          name: vedai-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: HUGGINGFACE_API_KEY
        sync: false
    disk:
      name: vedai-uploads
      mountPath: /app/user_data
      sizeGB: 10

  - type: web
    name: vedai-frontend
    runtime: node
    rootDir: frontend
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          name: vedai-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
